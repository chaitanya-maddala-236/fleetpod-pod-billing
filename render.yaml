services:
  - type: web
    name: fleetpod
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: DATA_DIR
        value: /tmp/fleetpod
      - key: DATABASE_URL
        sync: false
      - key: ENVIRONMENT
        value: production
      - key: SESSION_SECRET
        generateValue: true
      - key: OPENAI_VISION_MODEL
        value: gpt-4.1-mini
